name: Download official public JKP research data
on:
  push:
    branches: [research/jkp-practical-learnability]
    paths: [.github/workflows/jkp_download_public.yml, empirical_jkp_practical/fetch_public.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas openpyxl pyarrow
      - run: python empirical_jkp_practical/fetch_public.py --out jkp_public_raw
      - name: Include current replication code
        run: |
          mkdir -p jkp_public_raw/repository
          cp -r empirical_jkp_ctf empirical_jkp_practical jkp_public_raw/repository/
      - uses: actions/upload-artifact@v4
        with:
          name: official-jkp-public-data
          path: jkp_public_raw/
          retention-days: 30
