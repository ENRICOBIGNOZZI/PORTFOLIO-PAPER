name: One-time pandas 3 compatibility patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_pandas3_once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch read-only pandas 3 arrays
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('empirical_jkp_ctf/core.py'),
              Path('empirical_jkp_ctf/ctf_submission_matern.py'),
          ]
          old = 'ranked.to_numpy(dtype=np.float32, copy=False)'
          new = 'ranked.to_numpy(dtype=np.float32, copy=True)'
          for p in paths:
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add empirical_jkp_ctf/core.py empirical_jkp_ctf/ctf_submission_matern.py
          git commit -m 'Fix pandas 3 writable array compatibility'
          git push origin HEAD:main
