name: Gate2 global stress

on:
  push:
    branches: [research/gate2-global-stress]
    paths:
      - 'global_gate_study/**'
      - '.github/workflows/gate2_global_stress.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gate2-global-stress
  cancel-in-progress: false

jobs:
  global-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      WRDS_USERNAME: ${{ secrets.WRDS_USERNAME }}
      WRDS_PASSWORD: ${{ secrets.WRDS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas requests openpyxl sqlalchemy psycopg2-binary
      - name: Compile study
        run: python -m py_compile global_gate_study/run_global.py
      - name: Run global frozen-library stress test
        run: |
          set -euo pipefail
          mkdir -p global_gate_study/raw global_gate_study/results
          python -u global_gate_study/run_global.py \
            --raw global_gate_study/raw \
            --out global_gate_study/results \
            | tee global_gate_study/results/execution.log
      - name: Probe stock-level CTF access without downloading licensed tables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path('global_gate_study/results/wrds_ctf_probe.json')
          u=os.getenv('WRDS_USERNAME',''); p=os.getenv('WRDS_PASSWORD','')
          status={'credentials_configured':bool(u and p),'connected':False,'tables':{}}
          if u and p:
              try:
                  import pandas as pd
                  from sqlalchemy import create_engine, text
                  from sqlalchemy.engine import URL
                  url=URL.create('postgresql+psycopg2',username=u,password=p,host='wrds-pgdata.wharton.upenn.edu',port=9737,database='wrds',query={'sslmode':'require'})
                  eng=create_engine(url,pool_pre_ping=True)
                  with eng.connect() as conn:
                      for t in ['ctff_features','ctff_chars','ctff_daily_ret']:
                          q=f'SELECT * FROM contrib_global_factor.{t} LIMIT 1;'
                          d=pd.read_sql_query(text(q),conn)
                          status['tables'][t]={'columns':d.columns.tolist(),'sample_rows':len(d)}
                  status['connected']=True
              except Exception as exc:
                  status['error']=type(exc).__name__+': '+str(exc)[:500]
          out.write_text(json.dumps(status,indent=2))
          print(out.read_text())
          PY
      - name: Reconcile result tables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path('global_gate_study/results')
          r=pd.read_csv(p/'global_selector_results.csv')
          assert not r.empty
          assert set(['current','gate2','allpast','stack2','stack3']).issubset(set(r.selector))
          n=r[r.selector.eq('current')][['dataset','T']].drop_duplicates().shape[0]
          assert len(r)==n*r.selector.nunique()
          assert r[['gainQ','sr','meanC']].notna().all().all()
          print('reconciled', n, 'dataset-window comparisons and', r.selector.nunique(), 'selectors')
          PY
      - name: Record workflow run id
        run: echo "$GITHUB_RUN_ID" > global_gate_study/results/github_run_id.txt
      - name: Publish compact evidence on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in REPORT.md selector_aggregate.csv global_selector_results.csv annual_choices.csv dataset_manifest.csv frozen_common40.csv skipped.csv wrds_ctf_probe.json execution.log github_run_id.txt; do
            git add -f global_gate_study/results/$f
          done
          git diff --cached --quiet || git commit -m 'Record global Gate stress evidence [skip ci]'
          git push origin HEAD:research/gate2-global-stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gate2-Global-Stress
          path: global_gate_study/results/
          retention-days: 30
